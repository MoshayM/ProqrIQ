<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProqrIQ — Cost Engineering Platform</title>
    <meta name="description" content="AI-powered cost engineering and quotation platform for B2B manufacturing. Upload part drawings, get accurate cost breakdowns with 98% confidence in minutes." />
    <meta name="keywords" content="cost engineering, quotation, manufacturing, AI, BOM, bulk costing, supplier negotiation" />
    <meta name="author" content="ProqrIQ" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#1e2d4e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e2d4e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />

    <!-- PWA / Web App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="ProqrIQ" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProqrIQ" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- iOS splash screens (portrait) -->
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Windows / Edge -->
    <meta name="msapplication-TileColor" content="#1e2d4e" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="msapplication-config" content="none" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->

    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <meta property="og:site_name" content="ProqrIQ" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProqrIQ — Cost Engineering Reimagined" />
    <meta name="twitter:description" content="AI-powered cost estimation, supplier discovery, and bulk costing for B2B manufacturing engineers." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
